name: CI

on:
  pull_request:
  push:
    branches:
      - claude/clean-logo-design-p4j28z

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          COOKIE_SECRET: ci-only-secret-0123456789abcdef0123456789
